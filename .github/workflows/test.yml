name: test-python

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        polars: ["1", "2"]
    name: py${{ matrix.python-version }} polars${{ matrix.polars }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]" "polars>=${{ matrix.polars }},<$(( ${{ matrix.polars }} + 1 ))"
          uv run --no-sync python -c "import polars; print(polars.__version__)"
      - name: Test
        run: uv run --no-sync pytest -q
      # Baseline only: existing code has many findings, cleaned up in later work packages.
      - name: Ruff (informational)
        continue-on-error: true
        run: uv run --no-sync ruff check src tests
      - name: Pyright (informational)
        continue-on-error: true
        run: uv run --no-sync pyright src
