[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iohinspector"
version = "0.2.1"
authors = [
  { name="Diederick Vermetten", email="d.vermetten@gmail.com" },
  { name="Jacob de Nobel", email="jacobdenobel@gmail.com" },
]
description = "Load, convert and analyse benchmark data of iterative optimization heuristics (IOHexperimenter, COCO, Nevergrad, CSV)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "jsonschema>=4",
  "matplotlib",
  "moocore>=0.1.8",
  "numpy",
  "pandas",
  "polars>=1.33.1",
  "pyarrow", 
  "robustranking", 
  "seaborn",
  "skelo",
  "networkx"
]

[project.optional-dependencies]
test = [
  "coverage",
  "ioh",
  "pymoo"
]
dev = [
  "pytest",
  "hypothesis",
  "ruff",
  "pyright",
  "coverage",
  "ioh",
  "pymoo"
]


[project.scripts]
iohinspector = "iohinspector.cli:main"

[project.urls]
Homepage = "https://github.com/IOHprofiler/iohinspector"
Issues = "https://github.com/IOHprofiler/iohinspector/issues"
